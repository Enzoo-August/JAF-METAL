<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2a3d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JAF Metal">
  <meta name="description" content="Gestão da JAF Metal: estoque, compras, produção, máquinas, equipe e financeiro.">
  <title>JAF Metal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <script>
    // tema antes de desenhar (evita "piscar" claro no modo escuro)
    try { var t = localStorage.getItem('jaf.tema') || 'auto';
      document.documentElement.dataset.tema = (t === 'escuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'escuro' : 'claro'; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div class="carregando-tela"><img src="./assets/logo.png" alt="JAF Metal"><div class="giro"></div><p>Carregando…</p></div></div>
  <div id="avisos" aria-live="polite"></div>
  <noscript><p style="padding:24px">Ative o JavaScript para usar o sistema.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
