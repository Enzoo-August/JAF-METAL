name: Testes

# Roda a cada envio: proteção do repositório, tipos (TypeScript), build, banco de dados e telas
# (num navegador de verdade, no build de teste com dados inventados).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repositorio:
    name: Nada de dado real nem chave secreta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nenhuma planilha no repositório
        run: |
          if git ls-files | grep -iE '\.(xls|xlsx|xlsm|csv)$'; then echo "::error::Planilha no repositório"; exit 1; fi
      - name: Nenhuma chave secreta do Supabase no código
        run: |
          if grep -rInE 'sb_secret_[A-Za-z0-9_-]{10,}|service_role' --exclude-dir=.git --exclude-dir=node_modules --exclude=testes.yml .; then echo "::error::Chave secreta no código"; exit 1; fi

  codigo:
    name: Tipos e build do site de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
      - name: TypeScript (sem nenhum erro de tipo)
        run: npm run tipos
      - name: Build do site publicado
        run: npx vite build
      - name: O site publicado não leva o modo teste
        run: |
          if grep -rlE 'pglite|teste1234|entrar_teste' dist; then echo "::error::Código do modo teste no site publicado"; exit 1; fi

  banco:
    name: Banco (perfis, estoque, compras, financeiro, segurança)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
      - name: Testes do banco
        run: npm run teste:banco

  telas:
    name: Telas (roteiro e layout em celular, tablet e computador)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Instalar o navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Build de teste (dados inventados)
        run: npm run build:teste
      - name: Roteiro pelas telas e varredura de layout (4 perfis)
        run: npm run teste:telas
